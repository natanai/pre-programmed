name: Execute capture input repair

on:
  push:
    branches:
      - agent/capture-input-terminal-mode-repair-v2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/capture-input-terminal-mode-repair-v2
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/finish-capture-input-repair.py
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Assert owner wiring
        run: grep -Fq 'authoringContext={{ preferredRuntimeBindingKey: PLAYER_INPUT_BINDING }}' src/features/narrative/author/InteractionEditor.tsx
      - name: Commit verified repair
        run: |
          rm .github/workflows/finish-capture-input-repair-temp.yml
          rm .github/scripts/finish-capture-input-repair.py
          git config user.name "natanai"
          git config user.email "109430106+natanai@users.noreply.github.com"
          git add src/features/narrative/author/InteractionEditor.tsx tests/effectAuthoringContext.test.ts .github/workflows/finish-capture-input-repair-temp.yml .github/scripts/finish-capture-input-repair.py
          git commit -m "Complete captured input authoring repair"
          git push origin HEAD:agent/capture-input-terminal-mode-repair-v2
