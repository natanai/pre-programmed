name: Apply workflow hardening

on:
  push:
    branches:
      - stability/release-candidate-pass

permissions:
  contents: write

jobs:
  harden-workflows:
    if: github.event.head_commit.message == 'Run workflow hardening preparation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stability/release-candidate-pass

      - name: Harden retained workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=None):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s) of {old!r}, found {count}")
              if count == 0:
                  raise SystemExit(f"{path}: missing {old!r}")
              p.write_text(text.replace(old, new))

          for path in [".github/workflows/deploy.yml", ".github/workflows/build-portable-windows.yml"]:
              replace(path, "actions/checkout@v4", "actions/checkout@v7", 1)
              replace(path, "actions/setup-node@v4", "actions/setup-node@v7", 1)

          path = ".github/workflows/build-portable-windows.yml"
          replace(path, "working-directory: desktop\n        run: npm install --no-audit --no-fund", "working-directory: desktop\n        run: npm ci --no-audit --no-fund", 1)
          replace(path, "npx electron-builder --config electron-builder.yml --win --x64 --dir \"--config.extraMetadata.version=$env:VERSION\"", "npx electron-builder --config electron-builder.yml --win --x64 --dir --publish never \"--config.extraMetadata.version=$env:VERSION\"", 1)

          p = Path(path)
          text = p.read_text()
          needle = '''          if (@(Get-ChildItem (Join-Path $env:APP_ROOT "data") -Force).Count -ne 0) {\n            throw "Portable data folder must be empty before distribution."\n          }'''
          replacement = '''          if (@(Get-ChildItem (Join-Path $env:APP_ROOT "assets") -Force).Count -ne 0) {\n            throw "Portable assets folder must be empty before distribution."\n          }\n          if (@(Get-ChildItem (Join-Path $env:APP_ROOT "data") -Force).Count -ne 0) {\n            throw "Portable data folder must be empty before distribution."\n          }'''
          if text.count(needle) != 1:
              raise SystemExit("Portable empty-folder validation insertion point changed")
          text = text.replace(needle, replacement)

          needle = '''          if ($entries | Where-Object { $_ -match '(^|/)(AGENTS\\.md|FOUNDATION\\.md|DOS-VISUAL-TARGET\\.md|CODEX-HANDOFF\\.md)$' }) {\n            throw "Agent-facing documentation leaked into portable ZIP."\n          }'''
          replacement = needle + '''\n          if ($entries | Where-Object { $_ -match '\\.zip$' }) {\n            throw "Nested ZIP detected inside portable distribution."\n          }'''
          if text.count(needle) != 1:
              raise SystemExit("Portable ZIP validation insertion point changed")
          p.write_text(text.replace(needle, replacement))
          PY

      - name: Validate workflow diff
        run: |
          git diff --check
          grep -q 'actions/checkout@v7' .github/workflows/deploy.yml
          grep -q 'actions/setup-node@v7' .github/workflows/deploy.yml
          grep -q 'actions/checkout@v7' .github/workflows/build-portable-windows.yml
          grep -q 'actions/setup-node@v7' .github/workflows/build-portable-windows.yml
          grep -q 'run: npm ci --no-audit --no-fund' .github/workflows/build-portable-windows.yml
          grep -q -- '--publish never' .github/workflows/build-portable-windows.yml
          grep -q 'Nested ZIP detected inside portable distribution' .github/workflows/build-portable-windows.yml

      - name: Commit workflow hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy.yml .github/workflows/build-portable-windows.yml
          git commit -m "Harden production and portable workflows"
          git push origin HEAD:stability/release-candidate-pass
