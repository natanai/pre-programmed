name: Audit Author custom roles

on:
  push:
    branches:
      - author-ux-integration-refactor

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: author-ux-integration-refactor
      - name: Audit custom role and ReferenceField usage
        shell: bash
        run: |
          echo '=== CUSTOM ROLE USAGES ==='
          grep -RInE 'role:[[:space:]]*"[^"]+"' src --include='*.ts' --include='*.tsx' || true
          echo '=== DIRECT REFERENCEFIELD USAGES ==='
          grep -RIn 'ReferenceField' src --include='*.ts' --include='*.tsx' || true
          echo '=== RESOURCE-PICKER ROLE ==='
          grep -RIn 'resource-picker' src docs --include='*.ts' --include='*.tsx' --include='*.md' || true
