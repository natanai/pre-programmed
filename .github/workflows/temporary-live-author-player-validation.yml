name: Temporary live Author player validation

on:
  push:
    branches: [restore-live-authoring-on-player-workspaces]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: restore-live-authoring-on-player-workspaces
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Wire Author bridge into live player workspaces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/App.tsx')
          text = path.read_text()
          pattern = re.compile(
              r'(<PlayerWorkspaceHost[\s\S]*?context=\{\{[\s\S]*?events: handleEffectEvents,\n)'
              r'(\s*)(\}\}\n\s*onNavigate=\{setPlayerWorkspace\})'
          )
          replacement = (
              r'\1'
              '            author: authorExperience ? {\n'
              '              openWorkspace: (feature, workspace, data) => authorTasks.openTask({\n'
              '                type: "feature",\n'
              '                feature,\n'
              '                workspace,\n'
              '                data,\n'
              '              }),\n'
              '            } : undefined,\n'
              r'\2\3'
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one PlayerWorkspaceHost context seam; found {count}.')
          path.write_text(text)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Commit verified shell wiring and remove temporary workflow
        run: |
          rm .github/workflows/temporary-live-author-player-validation.yml
          git config user.name "natanai"
          git config user.email "109430106+natanai@users.noreply.github.com"
          git add src/App.tsx .github/workflows/temporary-live-author-player-validation.yml
          git commit -m "Keep player workspaces live and editable in Author mode"
          git push origin HEAD:restore-live-authoring-on-player-workspaces
