name: Diagnose live capture authoring

on:
  push:
    branches:
      - agent/diagnose-live-capture

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Find narrative legacy continuation references
        run: |
          git grep -n -E 'inputCapture|pendingInputCapture|matchMode.*capture|capture_input|\.disposition|\.destination' -- src/features/narrative src/features/commands src/App.tsx worker/features/narrative* tests || true
