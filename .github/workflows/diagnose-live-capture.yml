name: Verify narrative flow branch
# final verification after migration and flow-boundary audit
# retry after flow tests and migration coverage

on:
  push:
    branches:
      - agent/diagnose-live-capture

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/narrative-flow-input
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Find superseded Narrative capture fields
        run: |
          git grep -n -E 'inputCapture|pendingInputCapture|matchMode.*capture|\.disposition|outcome\.destination' -- src worker tests || true
      - run: npm run verify
