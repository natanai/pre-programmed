name: Apply Author resource picker role cleanup

on:
  push:
    branches:
      - author-ux-integration-refactor

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: author-ux-integration-refactor
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply resource picker role cleanup
        run: python scripts/apply-resource-picker-role-cleanup.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify repository
        run: npm run verify
      - name: Commit verified cleanup and remove one-shot tooling
        shell: bash
        run: |
          rm scripts/apply-resource-picker-role-cleanup.py
          rm .github/workflows/apply-resource-picker-role-cleanup.yml
          rm .github/workflows/audit-author-custom-roles.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/radix/author/workspaces.tsx src/features/narrative/author/nodeWorkspace.tsx src/author/ui/types.ts docs/author-ux-integration-refactor-plan.md scripts/apply-resource-picker-role-cleanup.py .github/workflows/apply-resource-picker-role-cleanup.yml .github/workflows/audit-author-custom-roles.yml
          git commit -m 'refactor: remove author resource picker escape hatch'
          git push origin HEAD:author-ux-integration-refactor
