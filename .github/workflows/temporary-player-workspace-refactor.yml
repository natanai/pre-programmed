name: Temporary player workspace refactor

on:
  push:
    branches: [fix-player-workspace-boundary]

permissions:
  contents: write

jobs:
  refactor-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-player-workspace-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Separate Player and Author workspace shells
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function edit(path, edits) {
            let source = fs.readFileSync(path, 'utf8');
            for (const [label, before, after] of edits) {
              const count = source.split(before).length - 1;
              if (count !== 1) throw new Error(`${path} / ${label}: expected one match, found ${count}`);
              source = source.replace(before, after);
            }
            fs.writeFileSync(path, source);
          }

          edit('src/App.tsx', [
            ['player imports',
              'import { AuthorWorkspaceHost } from "./author/workspace/AuthorWorkspaceHost";\n',
              'import { AuthorWorkspaceHost } from "./author/workspace/AuthorWorkspaceHost";\nimport { PlayerWorkspaceHost } from "./player/workspaces/PlayerWorkspaceHost";\nimport type { PlayerWorkspaceRequest } from "./player/workspaces/types";\n'],
            ['player state',
              '  const [pendingAuthorTryInput, setPendingAuthorTryInput] = useState("");\n  const authorTasks = useAuthorTaskRuntime();\n',
              '  const [pendingAuthorTryInput, setPendingAuthorTryInput] = useState("");\n  const [playerWorkspace, setPlayerWorkspace] = useState<PlayerWorkspaceRequest | null>(null);\n  const authorTasks = useAuthorTaskRuntime();\n'],
            ['focus guard',
              '    if (!typewriter.complete || pendingDestinationNodeId || panel || pendingPlaySession) return;\n',
              '    if (!typewriter.complete || pendingDestinationNodeId || panel || playerWorkspace || pendingPlaySession) return;\n'],
            ['focus deps',
              '  }, [typewriter.complete, pendingDestinationNodeId, panel, pendingPlaySession, requestingKey]);\n',
              '  }, [typewriter.complete, pendingDestinationNodeId, panel, playerWorkspace, pendingPlaySession, requestingKey]);\n'],
            ['player command routing',
              '        if (capability?.action.type === "open-workspace") {\n          setPanel({\n            type: "feature",\n            feature: capability.action.feature,\n            workspace: capability.action.workspace,\n            data: capability.action.data,\n          });\n',
              '        if (capability?.action.type === "open-player-workspace") {\n          setPlayerWorkspace({\n            feature: capability.action.feature,\n            workspace: capability.action.workspace,\n            data: capability.action.data,\n          });\n'],
            ['player runtime',
              '  const applyCanonicalSnapshot = (project: ProjectSnapshot) => {\n',
              '  const applyPlayerWorkspaceState = (state: PlayState) => {\n    if (!snapshot || !playState) return;\n    const transitioned = state.traversal.length > playState.traversal.length;\n    setPlayState(state);\n    if (!transitioned) return;\n    const node = snapshot.nodes.find((candidate) => candidate.id === state.currentNodeId);\n    if (node) showNode(snapshot, node, state);\n    setPlayerWorkspace(null);\n  };\n  const showPlayerWorkspaceOutput = (text: string) => {\n    historyPinnedToPresentRef.current = true;\n    appendActive();\n    setActiveText("");\n    setActiveNodeId(undefined);\n    setActiveSpeakerId(null);\n    setTranscript((lines) => [...lines, { id: crypto.randomUUID(), text }]);\n    setPlayerWorkspace(null);\n    window.requestAnimationFrame(scrollHistoryToPresent);\n  };\n  const applyCanonicalSnapshot = (project: ProjectSnapshot) => {\n'],
            ['player workspace open state',
              '  const editorOpen = authorTasks.hasTasks;\n  const authorExperience = authorMode && authorView;\n',
              '  const editorOpen = authorTasks.hasTasks;\n  const playerWorkspaceOpen = playerWorkspace !== null;\n  const authorExperience = authorMode && authorView;\n'],
            ['terminal hidden under player workspace',
              '      {typewriter.complete && !pendingDestinationNodeId && !panel && !pendingPlaySession ? <TerminalCommandComposer\n',
              '      {typewriter.complete && !pendingDestinationNodeId && !panel && !playerWorkspace && !pendingPlaySession ? <TerminalCommandComposer\n'],
            ['author play surface hidden',
              '        {authorExperience && typewriter.complete && !pendingDestinationNodeId && !requestingKey && !command && !panel && !pendingPlaySession\n',
              '        {authorExperience && typewriter.complete && !pendingDestinationNodeId && !requestingKey && !command && !panel && !playerWorkspace && !pendingPlaySession\n'],
            ['author home hidden',
              '        {authorExperience && typewriter.complete && !pendingDestinationNodeId && !panel && !pendingPlaySession ? <AuthorHome\n',
              '        {authorExperience && typewriter.complete && !pendingDestinationNodeId && !panel && !playerWorkspace && !pendingPlaySession ? <AuthorHome\n'],
            ['author close callback',
              '          onCancelLeave={authorTasks.cancelLeave}\n        />\n',
              '          onCancelLeave={authorTasks.cancelLeave}\n          requestClose={authorTasks.requestClose}\n        />\n        <PlayerWorkspaceHost\n          request={playerWorkspace}\n          context={{\n            snapshot,\n            playState,\n            updateState: applyPlayerWorkspaceState,\n            output: showPlayerWorkspaceOutput,\n            events: handleEffectEvents,\n          }}\n          onClose={() => setPlayerWorkspace(null)}\n        />\n'],
            ['remove external author x',
              '    {editorOpen ? <button className="work-surface-close" type="button" aria-label="Close Author tasks and return to play" onPointerDown={(event) => event.stopPropagation()} onClick={authorTasks.requestClose}>[X]</button> : null}\n',
              ''],
            ['settings hidden for either workspace',
              '    <AuthorSettings authorView={authorView} showAuthorViewToggle={authorMode} visible={!editorOpen && !pendingPlaySession} onToggleAuthorView={() => {\n',
              '    <AuthorSettings authorView={authorView} showAuthorViewToggle={authorMode} visible={!editorOpen && !playerWorkspaceOpen && !pendingPlaySession} onToggleAuthorView={() => {\n'],
          ]);

          edit('src/author/workspace/AuthorWorkspaceHost.tsx', [
            ['requestClose destructure',
              '  onConfirmLeave,\n  onCancelLeave,\n  ...shared\n',
              '  onConfirmLeave,\n  onCancelLeave,\n  requestClose,\n  ...shared\n'],
            ['requestClose prop',
              '  onCancelLeave: () => void;\n}) {\n',
              '  onCancelLeave: () => void;\n  requestClose: () => void;\n}) {\n'],
            ['portal master x',
              '  return createPortal(\n    <>\n      <div\n',
              '  return createPortal(\n    <>\n      <button\n        className="work-surface-close"\n        type="button"\n        aria-label="Close Author tasks and return to play"\n        onClick={requestClose}\n      >[X]</button>\n      <div\n'],
          ]);

          edit('src/author/authorDesktopSuite.css', [
            ['remove stale player host claim',
              '  /* AuthorWorkspaceHost is also used by player-facing workspaces such as\n   * Inventory, so dock geometry must remain explicitly scoped to Author mode. */\n',
              '  /* AuthorWorkspaceHost is Author-only; desktop geometry remains scoped\n   * to Author experience so player workspaces always use the player shell. */\n'],
          ]);
          NODE

          npm ci --no-audit --no-fund
          npm run verify

          git config user.name "natanai"
          git config user.email "109430106+natanai@users.noreply.github.com"
          git rm .github/workflows/temporary-player-workspace-refactor.yml
          git add src/App.tsx src/author/workspace/AuthorWorkspaceHost.tsx src/author/authorDesktopSuite.css
          git commit -m "Separate player workspaces from Author task routing"
          git push origin HEAD:fix-player-workspace-boundary
