name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pre-programmed-production
  cancel-in-progress: true

jobs:
  build-and-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build:pages
        env:
          VITE_API_ORIGIN: ${{ vars.PRE_PROGRAMMED_API_ORIGIN }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Probe deployed Worker binding metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
          const workerName = config.name;
          const root = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${encodeURIComponent(workerName)}/versions`;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };
          try {
            const listResponse = await fetch(`${root}?per_page=10`, { headers });
            if (!listResponse.ok) {
              console.log(`WORKER_VERSION_METADATA unavailable (${listResponse.status})`);
              process.exit(0);
            }
            const listPayload = await listResponse.json();
            const versions = Array.isArray(listPayload?.result) ? listPayload.result : [];
            const versionId = versions.find((version) => typeof version?.id === "string")?.id;
            if (!versionId) {
              console.log("WORKER_VERSION_D1_BINDING not-found (no-version)");
              process.exit(0);
            }
            const detailResponse = await fetch(`${root}/${encodeURIComponent(versionId)}`, { headers });
            if (!detailResponse.ok) {
              console.log(`WORKER_VERSION_DETAIL unavailable (${detailResponse.status})`);
              process.exit(0);
            }
            const detailPayload = await detailResponse.json();
            const bindings = detailPayload?.result?.resources?.bindings ?? [];
            const binding = bindings.find((candidate) =>
              candidate?.type === "d1"
              && candidate?.name === "DB"
              && typeof candidate?.database_id === "string"
            );
            console.log(binding ? "WORKER_VERSION_D1_BINDING available" : "WORKER_VERSION_D1_BINDING not-found");
          } catch {
            console.log("WORKER_VERSION_METADATA unavailable (request-error)");
          }
          NODE

      - name: Deploy API Worker
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SECRETS_FILE="$RUNNER_TEMP/pre-programmed-worker-secrets.json"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node --input-type=module - "$SECRETS_FILE" <<'NODE'
          import { writeFileSync } from "node:fs";
          if (!process.env.ADMIN_KEY) process.exit(1);
          writeFileSync(process.argv[2], JSON.stringify({ ADMIN_KEY: process.env.ADMIN_KEY }), { mode: 0o600 });
          NODE
          npx wrangler deploy --secrets-file "$SECRETS_FILE"

      - name: Verify API
        env:
          API_ORIGIN: ${{ vars.PRE_PROGRAMMED_API_ORIGIN }}
        run: |
          node --input-type=module <<'NODE'
          const fallbackOrigin = "https://pre-programmed.natanai.workers.dev";
          const origin = (process.env.API_ORIGIN || fallbackOrigin).replace(/\/+$/, "");
          const healthUrl = `${origin}/api/health`;
          let healthy = false;
          for (let attempt = 0; attempt < 12; attempt += 1) {
            try {
              const response = await fetch(healthUrl, { cache: "no-store" });
              const health = await response.json();
              if (response.ok && health?.ok === true && health?.persistence === "d1" && health?.authorConfigured === true) {
                healthy = true;
                break;
              }
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          if (!healthy) process.exit(1);

          try {
            const response = await fetch(`${origin}/api/project/snapshot`, { cache: "no-store" });
            const snapshot = await response.json();
            if (!response.ok || !Array.isArray(snapshot?.nodes) || typeof snapshot?.startNodeId !== "string") process.exit(1);
          } catch {
            process.exit(1);
          }
          NODE

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy-pages:
    needs: build-and-worker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
