name: Deploy production

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - docs/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pre-programmed-production
  cancel-in-progress: true

jobs:
  build-and-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Generate repository Media manifest
        run: npm run generate:assets

      - name: Prepare deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRE_PROGRAMMED_WORKER_NAME: ${{ vars.PRE_PROGRAMMED_WORKER_NAME }}
          PRE_PROGRAMMED_D1_DATABASE_NAME: ${{ vars.PRE_PROGRAMMED_D1_DATABASE_NAME }}
          PRE_PROGRAMMED_D1_DATABASE_ID: ${{ vars.PRE_PROGRAMMED_D1_DATABASE_ID }}
        run: node scripts/prepare-deployment-wrangler.mjs .wrangler.deploy.jsonc

      - name: Deploy API Worker
        id: deploy-worker
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/pre-programmed-wrangler-output.jsonl
        run: |
          SECRETS_FILE="$RUNNER_TEMP/pre-programmed-worker-secrets.json"
          trap 'rm -f "$SECRETS_FILE" .wrangler.deploy.jsonc "$WRANGLER_OUTPUT_FILE_PATH"' EXIT
          node --input-type=module - "$SECRETS_FILE" <<'NODE'
          import { writeFileSync } from "node:fs";
          if (!process.env.ADMIN_KEY) process.exit(1);
          writeFileSync(process.argv[2], JSON.stringify({ ADMIN_KEY: process.env.ADMIN_KEY }), { mode: 0o600 });
          NODE
          npx wrangler deploy --config .wrangler.deploy.jsonc --secrets-file "$SECRETS_FILE"
          node --input-type=module - "$WRANGLER_OUTPUT_FILE_PATH" "$GITHUB_OUTPUT" <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const entries = readFileSync(process.argv[2], "utf8")
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line));
          const deployment = entries.findLast((entry) => entry?.type === "deploy");
          const apiOrigin = deployment?.targets?.find((target) => /^https?:\/\//.test(target))?.replace(/\/+$/, "");
          if (!apiOrigin) {
            console.error("Wrangler did not report a deployed API target.");
            process.exit(1);
          }
          appendFileSync(process.argv[3], `api_origin=${apiOrigin}\n`);
          NODE

      - name: Build client for this installation
        run: npm run build:pages
        env:
          VITE_API_ORIGIN: ${{ vars.PRE_PROGRAMMED_API_ORIGIN || steps.deploy-worker.outputs.api_origin }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Verify deployed API
        env:
          API_ORIGIN: ${{ vars.PRE_PROGRAMMED_API_ORIGIN || steps.deploy-worker.outputs.api_origin }}
        run: |
          node --input-type=module <<'NODE'
          const origin = process.env.API_ORIGIN?.trim().replace(/\/+$/, "");
          if (!origin) process.exit(1);

          let healthy = false;
          for (let attempt = 0; attempt < 12; attempt += 1) {
            try {
              const response = await fetch(`${origin}/api/health`, { cache: "no-store" });
              const health = await response.json();
              if (
                response.ok &&
                health?.ok === true &&
                health?.authorConfigured === true &&
                health?.mediaGeneratedPersistence === "d1" &&
                health?.mediaFilePersistence === "repository"
              ) {
                healthy = true;
                break;
              }
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          if (!healthy) process.exit(1);

          try {
            const response = await fetch(`${origin}/api/project/snapshot`, { cache: "no-store" });
            const snapshot = await response.json();
            if (!response.ok || typeof snapshot !== "object" || snapshot === null || typeof snapshot.revision !== "number") process.exit(1);
          } catch {
            process.exit(1);
          }
          NODE

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy-pages:
    needs: build-and-worker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
