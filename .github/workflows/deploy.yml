name: Deploy production

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pre-programmed-production
  cancel-in-progress: true

jobs:
  build-and-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build:pages
        env:
          VITE_API_ORIGIN: ${{ vars.PRE_PROGRAMMED_API_ORIGIN }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Ensure media storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRE_PROGRAMMED_WORKER_NAME: ${{ vars.PRE_PROGRAMMED_WORKER_NAME }}
          PRE_PROGRAMMED_ASSET_BUCKET_NAME: ${{ vars.PRE_PROGRAMMED_ASSET_BUCKET_NAME }}
        run: node scripts/ensure-deployment-r2.mjs

      - name: Prepare deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRE_PROGRAMMED_WORKER_NAME: ${{ vars.PRE_PROGRAMMED_WORKER_NAME }}
          PRE_PROGRAMMED_D1_DATABASE_NAME: ${{ vars.PRE_PROGRAMMED_D1_DATABASE_NAME }}
          PRE_PROGRAMMED_D1_DATABASE_ID: ${{ vars.PRE_PROGRAMMED_D1_DATABASE_ID }}
          PRE_PROGRAMMED_ASSET_BUCKET_NAME: ${{ vars.PRE_PROGRAMMED_ASSET_BUCKET_NAME }}
        run: node scripts/prepare-deployment-wrangler.mjs .wrangler.deploy.jsonc

      - name: Deploy API Worker
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SECRETS_FILE="$RUNNER_TEMP/pre-programmed-worker-secrets.json"
          trap 'rm -f "$SECRETS_FILE" .wrangler.deploy.jsonc' EXIT
          node --input-type=module - "$SECRETS_FILE" <<'NODE'
          import { writeFileSync } from "node:fs";
          if (!process.env.ADMIN_KEY) process.exit(1);
          writeFileSync(process.argv[2], JSON.stringify({ ADMIN_KEY: process.env.ADMIN_KEY }), { mode: 0o600 });
          NODE
          npx wrangler deploy --config .wrangler.deploy.jsonc --secrets-file "$SECRETS_FILE"

      - name: Verify API
        env:
          API_ORIGIN: ${{ vars.PRE_PROGRAMMED_API_ORIGIN }}
        run: |
          node --input-type=module <<'NODE'
          const fallbackOrigin = "https://pre-programmed.natanai.workers.dev";
          const origin = (process.env.API_ORIGIN || fallbackOrigin).replace(/\/+$/, "");
          const healthUrl = `${origin}/api/health`;
          let healthy = false;
          for (let attempt = 0; attempt < 12; attempt += 1) {
            try {
              const response = await fetch(healthUrl, { cache: "no-store" });
              const health = await response.json();
              if (response.ok && health?.ok === true && health?.persistence === "d1" && health?.mediaPersistence === "r2" && health?.authorConfigured === true) {
                healthy = true;
                break;
              }
            } catch {}
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          if (!healthy) process.exit(1);

          try {
            const response = await fetch(`${origin}/api/project/snapshot`, { cache: "no-store" });
            const snapshot = await response.json();
            if (!response.ok || !Array.isArray(snapshot?.nodes) || typeof snapshot?.startNodeId !== "string") process.exit(1);
          } catch {
            process.exit(1);
          }
          NODE

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy-pages:
    needs: build-and-worker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
