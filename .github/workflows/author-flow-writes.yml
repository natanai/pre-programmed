name: Author flow finite input and Save evidence
on:
  workflow_dispatch:
  push:
    branches:
      - 'audit/author-flow-write-*'
    paths:
      - '.github/workflows/author-flow-writes.yml'
      - 'scripts/author-flow/**'
      - 'audit/author-flow/**'
      - 'package.json'
permissions:
  contents: write
concurrency:
  group: author-flow-write-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install isolated test-only Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check audit tools
        run: |
          node --check scripts/author-flow/explore.mjs
          node --check scripts/author-flow/validate-traces.mjs
      - name: Capture finite text input and canonical Save
        run: npm run audit:author:explore -- --writes --viewport both
      - name: Validate persistence and coverage
        run: |
          node scripts/author-flow/validate-traces.mjs
          npm run audit:author:coverage
          npm run audit:author:coverage-check
          node -e 'const c=require("./audit/author-flow/coverage.json");if(c.executed.fixture_count<12||(c.executed.by_event.fill??0)<6)process.exit(1);console.log(c.executed.by_event)'
      - name: Verify engine and build
        run: npm run verify
      - name: Commit raw write evidence then regenerate coverage
        if: github.event_name == 'push'
        run: |
          git add audit/author-flow/traces
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Record canonical Save persistence evidence in disposable D1'
            git restore -- audit/author-flow/coverage.json
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            npm run audit:author:coverage
            git add audit/author-flow/coverage.json
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh Author audit coverage from write traces'
            fi
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: author-flow-write-traces
          path: |
            audit/author-flow/traces/
            audit/author-flow/coverage.json
          retention-days: 30
