name: Apply Player Command structured migration

on:
  push:
    branches:
      - author-ux-integration-refactor

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: author-ux-integration-refactor
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Migrate Player Command editor
        run: python scripts/apply-player-command-structured.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify repository
        run: npm run verify
      - name: Commit verified migration and remove one-shot tooling
        shell: bash
        run: |
          rm scripts/apply-player-command-structured.py
          rm .github/workflows/apply-player-command-structured.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/author/ui/workspaceDefinition.tsx src/features/commands/author/commandWorkspace.tsx src/features/commands/author/structuredWorkspaces.ts src/features/commands/author/CommandSettings.tsx src/features/commands/author/commandSettings.css src/features/commands/author/manifest.tsx src/author/features/registry.tsx scripts/apply-player-command-structured.py .github/workflows/apply-player-command-structured.yml
          git commit -m 'refactor: structure player command editor'
          git push origin HEAD:author-ux-integration-refactor
