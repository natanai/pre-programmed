name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pre-programmed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify and build Pages client
        run: npm run verify:pages

      - name: Deploy API Worker
        if: github.event_name == 'push'
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WORKER_SECRETS_FILE="$RUNNER_TEMP/pre-programmed-worker-secrets.json"
          export WORKER_SECRETS_FILE
          trap 'rm -f "$WORKER_SECRETS_FILE"' EXIT
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          if (!process.env.ADMIN_KEY) {
            console.error("Required GitHub Actions secret ADMIN_KEY is not configured.");
            process.exit(1);
          }

          writeFileSync(
            process.env.WORKER_SECRETS_FILE,
            JSON.stringify({ ADMIN_KEY: process.env.ADMIN_KEY }),
            { mode: 0o600 },
          );
          NODE
          npx wrangler deploy --secrets-file "$WORKER_SECRETS_FILE"

      - name: Verify production API
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'NODE'
          const url = "https://pre-programmed.natanai.workers.dev/api/health";
          let lastError = "unknown error";

          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const response = await fetch(url, {
                cache: "no-store",
                headers: {
                  Accept: "application/json",
                  "Cache-Control": "no-cache",
                },
              });
              const contentType = response.headers.get("content-type") ?? "";
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              if (!contentType.includes("application/json")) {
                throw new Error(`expected JSON, got ${contentType || "no content-type"}`);
              }

              const health = await response.json();
              if (health?.ok !== true || health?.service !== "pre-programmed" || health?.apiVersion !== 1 || health?.persistence !== "d1" || health?.authorConfigured !== true) {
                throw new Error(`unexpected health payload: ${JSON.stringify(health)}`);
              }

              console.log("Production API verified:", health);
              process.exit(0);
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
              console.log(`API verification attempt ${attempt}/12 failed: ${lastError}`);
              if (attempt < 12) await new Promise((resolve) => setTimeout(resolve, 5000));
            }
          }

          console.error(`Production API verification failed: ${lastError}`);
          process.exit(1);
          NODE

      - name: Configure Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy-pages:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
