name: Temporary interaction conversation prose patch

on:
  push:
    branches: [interaction-conversation-prose]

permissions:
  contents: write

concurrency:
  group: temp-interaction-conversation-prose
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: interaction-conversation-prose
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply scripted changes when present
        shell: bash
        run: |
          if [ ! -f .github/apply_interaction_conversation.py ]; then
            echo "Transform script not staged yet."
            exit 0
          fi
          python .github/apply_interaction_conversation.py
          python - <<'PY'
          from pathlib import Path
          path = Path("worker/features/narrativePersistence.ts")
          text = path.read_text()
          broken = '''    if (operation.type === "interaction.delete")      ];
              }

              if (operation.type === "interaction.delete") {'''
          fixed = '''    if (operation.type === "interaction.delete") {'''
          if broken not in text:
              raise SystemExit("Expected temporary persistence splice was not found")
          path.write_text(text.replace(broken, fixed, 1))
          PY
      - name: Verify
        if: ${{ hashFiles('.github/apply_interaction_conversation.py') != '' }}
        run: |
          npm ci --no-audit --no-fund
          npm run verify
      - name: Commit clean result
        if: ${{ hashFiles('.github/apply_interaction_conversation.py') != '' }}
        shell: bash
        run: |
          git rm .github/apply_interaction_conversation.py .github/workflows/temp-apply-interaction-conversation.yml
          git config user.name "natanai"
          git config user.email "109430106+natanai@users.noreply.github.com"
          git add -A
          git commit -m "Share Node conversation prose format with responses"
          git push origin HEAD:interaction-conversation-prose
