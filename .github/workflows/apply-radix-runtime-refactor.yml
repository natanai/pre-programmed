name: Apply Radix runtime refactor

on:
  push:
    branches: [author-ux-integration-refactor]
    paths:
      - scripts/refactor-radix-app.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: author-ux-integration-refactor

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic App refactor
        run: node scripts/refactor-radix-app.mjs

      - run: npm ci --no-audit --no-fund
      - run: npm run verify

      - name: Commit verified refactor and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git rm scripts/refactor-radix-app.mjs .github/workflows/apply-radix-runtime-refactor.yml
          git commit -m "refactor: delegate radix runtime presentation"
          git push origin HEAD:author-ux-integration-refactor
