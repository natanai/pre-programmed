name: Temporary Author surface validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build:pages
        env:
          VITE_API_ORIGIN: https://example.invalid
          VITE_BASE_PATH: /pre-programmed/

# Temporary validation only; delete before merge.
