name: Apply installation universe text changes

on:
  push:
    branches:
      - feature/installation-universe-text

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[installation-text-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/installation-universe-text
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply repository patch
        run: node scripts/run-installation-universe-text-patch.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify engine
        run: npm run verify

      - name: Verify local runtime
        run: npm run verify:local

      - name: Check portable desktop host syntax
        run: node --check desktop/main.cjs

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github/workflows/build-portable-windows.yml' ':!scripts/.apply-installation-universe-text-fixed.mjs'
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "Make startup phrase installation-editable [installation-text-patch]"
          git push origin HEAD:feature/installation-universe-text
