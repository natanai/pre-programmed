name: Verify Author task runtime

on:
  push:
    branches:
      - author-task-runtime

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:pages
        env:
          VITE_API_ORIGIN: ""
          VITE_BASE_PATH: /pre-programmed/
