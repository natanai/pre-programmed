name: Temporary player navigation validation

on:
  push:
    branches: [fix-player-workspace-boundary]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-player-workspace-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire navigation and verify
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/App.tsx';
          let source = fs.readFileSync(path, 'utf8');
          const before = '          }}\n          onClose={() => setPlayerWorkspace(null)}\n        />\n';
          const after = '          }}\n          onNavigate={setPlayerWorkspace}\n          onClose={() => setPlayerWorkspace(null)}\n        />\n';
          const count = source.split(before).length - 1;
          if (count !== 1) throw new Error(`expected one PlayerWorkspaceHost close block, found ${count}`);
          fs.writeFileSync(path, source.replace(before, after));
          NODE

          npm ci --no-audit --no-fund
          npm run verify

          git config user.name "natanai"
          git config user.email "109430106+natanai@users.noreply.github.com"
          git rm .github/workflows/temporary-player-navigation-validation.yml
          git add src/App.tsx
          git commit -m "Compose authored State groups into player workspace bar"
          git push origin HEAD:fix-player-workspace-boundary
