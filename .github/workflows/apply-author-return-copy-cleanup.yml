name: Apply Author return copy cleanup

on:
  push:
    branches:
      - author-ux-integration-refactor

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: author-ux-integration-refactor
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Remove redundant nested return copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          host_path = Path('src/author/workspace/AuthorWorkspaceHost.tsx')
          host = host_path.read_text()
          replacements = {
              '  const parentLabel = taskLabels.at(-2)?.label;\n': '',
              '  const returnsToParent = activeTask?.route.type === "feature" && Boolean(activeTask.route.data?.resourceTask) && parentLabel;\n': '',
              '            {returnsToParent ? <span className="author-task-return">SAVE RETURNS TO {parentLabel}</span> : null}\n': '',
          }
          for old, new in replacements.items():
              count = host.count(old)
              expected = 2 if 'returnsToParent ? <span' in old else 1
              if count != expected:
                  raise SystemExit(f'Expected {expected} host match(es), got {count}: {old.strip()}')
              host = host.replace(old, new)
          if 'SAVE RETURNS TO' in host or 'author-task-return' in host or 'returnsToParent' in host or 'parentLabel' in host:
              raise SystemExit('Nested return mechanics copy or state remains in Author host')
          host_path.write_text(host)

          css_path = Path('src/author/authorWorkspaceShell.css')
          css = css_path.read_text()
          old = '.author-task-return,\n.author-workspace-stack-heading {'
          new = '.author-workspace-stack-heading {'
          if css.count(old) != 1:
              raise SystemExit('Expected one shared return/stack-heading CSS group')
          css = css.replace(old, new)
          if 'author-task-return' in css:
              raise SystemExit('Dead author-task-return selector remains')
          css_path.write_text(css)
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify repository
        run: npm run verify
      - name: Commit verified cleanup and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-author-return-copy-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/author/workspace/AuthorWorkspaceHost.tsx src/author/authorWorkspaceShell.css .github/workflows/apply-author-return-copy-cleanup.yml
          git commit -m 'ux: remove redundant nested return copy'
          git push origin HEAD:author-ux-integration-refactor
