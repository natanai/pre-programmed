name: Apply Inventory body resource migration

on:
  push:
    branches:
      - author-ux-integration-refactor

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: author-ux-integration-refactor
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Migrate Body background to semantic resource node
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/inventory/author/bodyWorkspaces.tsx')
          text = path.read_text()

          old_import = 'import { ReferenceField } from "../../../author/resources/ReferenceField";\n'
          if text.count(old_import) != 1:
              raise SystemExit('Expected one direct ReferenceField import')
          text = text.replace(old_import, '')

          old = '''            { type: "custom", id: "inventory-body-type-image", role: "resource-picker", content: <ReferenceField kind="media-image" value={draft.bodyType.assetId} onChange={(assetId) => setDraft((current) => ({ ...current, bodyType: { ...current.bodyType, assetId } }))} placeholder="none" /> },'''
          new = '''            {
              type: "resource" as const,
              id: "inventory-body-type-image",
              label: "Background image",
              kind: "media-image",
              value: draft.bodyType.assetId,
              placeholder: "none",
              showPreview: true,
              onChange: (assetId: string) => setDraft((current) => ({ ...current, bodyType: { ...current.bodyType, assetId } })),
            },'''
          if text.count(old) != 1:
              raise SystemExit('Expected one Body background custom resource picker')
          text = text.replace(old, new)

          if 'ReferenceField' in text:
              raise SystemExit('Direct ReferenceField usage remains in bodyWorkspaces')
          if 'role: "resource-picker"' in text:
              raise SystemExit('Legacy resource-picker escape hatch remains in bodyWorkspaces')

          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify repository
        run: npm run verify
      - name: Commit verified migration and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-inventory-body-resource-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/inventory/author/bodyWorkspaces.tsx .github/workflows/apply-inventory-body-resource-migration.yml
          git commit -m 'refactor: use semantic resource for body background'
          git push origin HEAD:author-ux-integration-refactor
