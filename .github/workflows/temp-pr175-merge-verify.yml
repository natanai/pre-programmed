name: Temporary PR 175 merge verify

on:
  push:
    branches: [author-response-mobile-flow]

permissions:
  contents: read

jobs:
  verify-merge-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out PR merge candidate
        shell: bash
        run: |
          git fetch origin refs/pull/175/merge:refs/remotes/origin/pr-175-merge
          git checkout --detach refs/remotes/origin/pr-175-merge
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify merge candidate
        run: |
          npm ci --no-audit --no-fund
          npm run verify
