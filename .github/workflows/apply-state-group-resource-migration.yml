name: Apply State group resource migration

on:
  push:
    branches:
      - author-ux-integration-refactor

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: author-ux-integration-refactor
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Migrate State group picker to semantic resource node
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/features/state/author/workspaces.tsx')
          text = path.read_text()

          old_import = 'import { ReferenceField } from "../../../author/resources/ReferenceField";\n'
          if text.count(old_import) != 1:
              raise SystemExit('Expected one direct ReferenceField import')
          text = text.replace(old_import, '')

          pattern = re.compile(
              r'          \{\n'
              r'            type: "custom",\n'
              r'            id: `\$\{id\}-group-picker`,\n'
              r'            role: "resource-picker",\n'
              r'            content: <ReferenceField\n'
              r'              kind="state-group"\n'
              r'              value=\{presentation\?\.groupId \?\? ""\}\n'
              r'              allowEmpty=\{false\}\n'
              r'              placeholder="choose or create a group"\n'
              r'              onChange=\{\(groupId\) => setPresentation\(\{\n'
              r'                groupId,\n'
              r'                order: presentation\?\.order \?\? 0,\n'
              r'                visibleWhen: presentation\?\.visibleWhen \?\? ALWAYS,\n'
              r'              \}\)\}\n'
              r'            />,\n'
              r'          \},'
          )
          replacement = '\n'.join([
              '          {',
              '            type: "resource" as const,',
              '            id: `${id}-group-picker`,',
              '            label: "Group",',
              '            kind: "state-group",',
              '            value: presentation?.groupId ?? "",',
              '            allowEmpty: false,',
              '            placeholder: "choose or create a group",',
              '            onChange: (groupId: string) => setPresentation({',
              '              groupId,',
              '              order: presentation?.order ?? 0,',
              '              visibleWhen: presentation?.visibleWhen ?? ALWAYS,',
              '            }),',
              '          },',
          ])
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Expected one State player-presentation custom resource picker')

          if 'ReferenceField' in text:
              raise SystemExit('Direct ReferenceField usage remains in State workspaces')
          if 'role: "resource-picker"' in text:
              raise SystemExit('Legacy resource-picker escape hatch remains in State workspaces')

          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify repository
        run: npm run verify
      - name: Commit verified migration and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-state-group-resource-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/state/author/workspaces.tsx .github/workflows/apply-state-group-resource-migration.yml
          git commit -m 'refactor: use semantic resource for state groups'
          git push origin HEAD:author-ux-integration-refactor
