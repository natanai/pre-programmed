name: Temporary Run Navigation shell cleanup

on:
  push:
    branches: [fix/run-navigation-shell-cleanup]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/run-navigation-shell-cleanup
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Remove legacy Run Navigation shell leftovers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()
          replacements = [
              ('    if (authorMode && authorView && ["/locations", "/bookmark", "locations"].includes(normalized)) { setPanel({ type: "workspace", view: "locations" }); return; }\n    if (authorMode && authorView && ["/history", "history"].includes(normalized)) { setPanel({ type: "workspace", view: "history" }); return; }\n', ''),
              ('  const restoreBookmark = (bookmark: AuthorBookmark) => {', '  const restoreRunBookmark = (bookmark: AuthorBookmark) => {'),
              ('    authorTasks.closeAll(); setAuthorMessage("LOCATION LOADED.");', '    authorTasks.closeAll(); setAuthorMessage("RUN BOOKMARK LOADED.");'),
              ('          onRestore={restoreBookmark}', '          onRestore={restoreRunBookmark}'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected App.tsx fragment not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Commit verified shell cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx
          git commit -m "Finish Run Navigation app-shell cleanup"
          git push origin HEAD:fix/run-navigation-shell-cleanup
