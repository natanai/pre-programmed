name: Apply Narrative prose provenance extraction

on:
  push:
    branches:
      - author-ux-integration-refactor

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: author-ux-integration-refactor
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Move Interaction prose provenance into Narrative runtime
        run: python scripts/apply-narrative-prose-provenance-extraction.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify repository
        run: npm run verify
      - name: Commit verified extraction and remove one-shot tooling
        shell: bash
        run: |
          rm scripts/apply-narrative-prose-provenance-extraction.py
          rm .github/workflows/apply-narrative-prose-provenance-extraction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/features/narrative/runtime.ts scripts/apply-narrative-prose-provenance-extraction.py .github/workflows/apply-narrative-prose-provenance-extraction.yml
          git commit -m 'refactor: keep interaction prose provenance in narrative runtime'
          git push origin HEAD:author-ux-integration-refactor
