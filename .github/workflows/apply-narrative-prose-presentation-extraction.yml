name: Apply Narrative prose presentation extraction

on:
  push:
    branches:
      - author-ux-integration-refactor

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: author-ux-integration-refactor
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Delegate Narrative prose presentation from App
        run: python .github/scripts/apply-narrative-prose-presentation-extraction.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify repository
        run: npm run verify
      - name: Commit verified extraction and remove one-shot tooling
        shell: bash
        run: |
          rm .github/scripts/apply-narrative-prose-presentation-extraction.py
          rm .github/workflows/apply-narrative-prose-presentation-extraction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/scripts/apply-narrative-prose-presentation-extraction.py .github/workflows/apply-narrative-prose-presentation-extraction.yml
          git commit -m 'refactor: delegate narrative prose presentation'
          git push origin HEAD:author-ux-integration-refactor
