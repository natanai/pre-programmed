name: Apply release hardening

on:
  push:
    branches:
      - stability/release-candidate-pass

permissions:
  contents: write

jobs:
  harden:
    if: github.event.head_commit.message == 'Run release hardening preparation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stability/release-candidate-pass

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Apply source ownership cleanup
        run: node scripts/apply-release-hardening.mjs

      - name: Generate locked desktop dependency tree
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify source before commit
        run: |
          if git grep -n 'captionOverride' -- src; then
            echo 'Radix caption override escape hatch still exists.' >&2
            exit 1
          fi
          npm run verify

      - name: Commit hardened source and desktop lock
        shell: bash
        run: |
          rm scripts/apply-release-hardening.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/radix/ui/RadixSequenceSurface.tsx desktop/package-lock.json scripts/apply-release-hardening.mjs
          git diff --cached --check
          git commit -m "Harden release ownership and desktop dependencies"
          git push origin HEAD:stability/release-candidate-pass
