name: Author flow stratified evidence
on:
  workflow_dispatch:
  push:
    branches:
      - 'audit/author-flow-stratified-*'
    paths:
      - '.github/workflows/author-flow-stratified.yml'
      - 'scripts/author-flow/**'
      - 'audit/author-flow/**'
      - 'package.json'
permissions:
  contents: write
concurrency:
  group: author-flow-stratified-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install test-only Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate explorer syntax
        run: node --check scripts/author-flow/explore.mjs
      - name: Explore more Author branches without replacing original fixtures
        run: npm run audit:author:explore -- --suite wide --strategy stratified --max-states 80 --max-executions 110 --max-depth 4
      - name: Validate all observed edges and coverage
        run: |
          node scripts/author-flow/validate-traces.mjs
          npm run audit:author:coverage
          npm run audit:author:coverage-check
          npm run audit:author:trace -- --fixture desktop-wide --find 'TOOLS' > /dev/null
          node -e 'const c=require("./audit/author-flow/coverage.json");if(c.executed.fixture_count<4||c.executed.transition_count<78)process.exit(1);console.log(JSON.stringify(c.executed))'
      - name: Engine verification
        run: npm run verify
      - name: Commit source-only evidence to audit branch
        if: github.event_name == 'push'
        run: |
          git add audit/author-flow/traces audit/author-flow/coverage.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Capture stratified observed Author flow paths'
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Archive trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: author-flow-stratified-traces
          path: |
            audit/author-flow/traces/
            audit/author-flow/coverage.json
          retention-days: 30
          if-no-files-found: warn
