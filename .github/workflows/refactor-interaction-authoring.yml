name: Refactor Interaction authoring helper

on:
  push:
    branches: [author-ux-integration-refactor]
    paths:
      - .github/workflows/refactor-interaction-authoring.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: author-ux-integration-refactor
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: python .github/scripts/refactor-interaction-authoring.py
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - name: Commit verified migration and remove temporary tooling
        run: |
          git config user.name "natanai"
          git config user.email "109430106+natanai@users.noreply.github.com"
          rm .github/scripts/refactor-interaction-authoring.py
          rm .github/workflows/refactor-interaction-authoring.yml
          git add -A
          git commit -m "refactor: share interaction authoring semantics"
          git push origin HEAD:author-ux-integration-refactor
