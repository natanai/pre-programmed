name: Build portable Windows engine

on:
  workflow_dispatch:
    inputs:
      version:
        description: Portable engine version (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-portable-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Resolve portable version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Version must be semver-like, such as 0.1.0 or 0.1.0-beta.1"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify release source
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Versioned portable releases must be built from main."
          }

      - name: Install engine dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify engine before packaging
        run: npm run verify

      - name: Verify canonical no-cloud runtime
        run: npm run verify:local

      - name: Verify hosted deployment shape without Cloudflare
        shell: pwsh
        env:
          GITHUB_REPOSITORY: example/pre-programmed-test
          PRE_PROGRAMMED_WORKER_NAME: pre-programmed-test
          PRE_PROGRAMMED_D1_DATABASE_NAME: pre-programmed-test-db
          PRE_PROGRAMMED_D1_DATABASE_ID: 11111111-1111-4111-8111-222222222222
          PRE_PROGRAMMED_CLIENT_ORIGIN: https://example.github.io
          CLOUDFLARE_ACCOUNT_ID: dry-run-account
          CLOUDFLARE_API_TOKEN: dry-run-token
        run: |
          $config = Join-Path $PWD ".wrangler.hosted-dry-run.jsonc"
          $bundle = Join-Path $env:RUNNER_TEMP "pre-programmed-hosted-worker"
          if (Test-Path $bundle) { Remove-Item $bundle -Recurse -Force }
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null

          node scripts/prepare-deployment-wrangler.mjs $config
          $parsed = Get-Content $config -Raw | ConvertFrom-Json
          if ($parsed.name -ne "pre-programmed-test") { throw "Hosted dry-run Worker name was not installation-owned." }
          $database = @($parsed.d1_databases | Where-Object { $_.binding -eq "DB" })
          if ($database.Count -ne 1 -or $database[0].database_name -ne "pre-programmed-test-db" -or $database[0].database_id -ne "11111111-1111-4111-8111-222222222222") {
            throw "Hosted dry-run D1 binding was not generated correctly."
          }
          if ($parsed.vars.CLIENT_ORIGIN -ne "https://example.github.io") {
            throw "Hosted dry-run client origin was not generated correctly."
          }

          npx wrangler deploy --dry-run --config $config --outdir $bundle
          $workerModules = @(Get-ChildItem $bundle -Recurse -File | Where-Object { $_.Extension -in @('.js', '.mjs') })
          if ($workerModules.Count -lt 1) { throw "Hosted Wrangler dry-run did not produce a Worker module." }

          $env:VITE_API_ORIGIN = "https://api.example.invalid"
          $env:VITE_BASE_PATH = "/pre-programmed-test/"
          npm run build:pages
          if (-not (Test-Path dist/index.html)) { throw "Hosted Pages dry-run did not produce dist/index.html." }

          Remove-Item $config -Force -ErrorAction SilentlyContinue
          Remove-Item $bundle -Recurse -Force -ErrorAction SilentlyContinue

      - name: Remove installation Media from portable build workspace
        shell: pwsh
        run: |
          if (Test-Path public/assets) { Remove-Item public/assets -Recurse -Force }
          New-Item -ItemType Directory -Path public/assets -Force | Out-Null

      - name: Build clean engine client
        run: npm run build
        env:
          VITE_API_ORIGIN: ""

      - name: Install isolated desktop host dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Bundle Worker through Wrangler
        shell: pwsh
        run: |
          $wranglerBundle = "desktop/build/wrangler"
          New-Item -ItemType Directory -Path $wranglerBundle -Force | Out-Null
          npx wrangler deploy --dry-run --config wrangler.local.jsonc --outdir $wranglerBundle
          $javascript = @(Get-ChildItem $wranglerBundle -Recurse -File | Where-Object { $_.Extension -in @('.js', '.mjs') })
          if ($javascript.Count -ne 1) {
            $javascript | ForEach-Object { Write-Host $_.FullName }
            throw "Expected Wrangler dry-run to produce exactly one bundled Worker JavaScript module; found $($javascript.Count)."
          }
          Copy-Item $javascript[0].FullName "desktop/build/worker.mjs" -Force
          if (-not (Test-Path desktop/build/worker.mjs)) { throw "Wrangler did not produce the portable Worker bundle." }

      - name: Reject installation-specific references
        shell: pwsh
        run: |
          $patterns = @(
            'workers\.dev',
            'CLOUDFLARE_ACCOUNT_ID',
            'CLOUDFLARE_API_TOKEN',
            'PRE_PROGRAMMED_API_ORIGIN',
            'natanai'
          )
          $matches = Get-ChildItem dist, desktop/build -Recurse -File |
            Select-String -Pattern $patterns -ErrorAction SilentlyContinue
          if ($matches) {
            $matches | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber): $($_.Line)" }
            throw "Portable runtime contains installation-specific references."
          }

      - name: Build pre-extracted Windows runtime
        working-directory: desktop
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx electron-builder --config electron-builder.yml --win --x64 --dir --publish never "--config.extraMetadata.version=$env:VERSION"

      - name: Stage contained portable folder
        id: stage
        shell: pwsh
        run: |
          $stageRoot = Join-Path $env:RUNNER_TEMP "pre-programmed-portable-folder"
          $appRoot = Join-Path $stageRoot "Pre-Programmed"
          $engineRoot = Join-Path $appRoot "_engine"
          if (Test-Path $stageRoot) { Remove-Item $stageRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $engineRoot -Force | Out-Null

          Copy-Item "desktop/release/win-unpacked/*" $engineRoot -Recurse -Force
          Copy-Item "desktop/portable-readme.txt" (Join-Path $engineRoot "README.txt")
          Copy-Item "desktop/installation-template.txt" (Join-Path $appRoot "installation.txt")
          New-Item -ItemType Directory -Path (Join-Path $appRoot "assets") -Force | Out-Null

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "Visual Studio locator was not available on the Windows runner." }
          $vsInstall = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $vsInstall) { throw "A Visual C++ toolchain was not available to build the portable launcher." }
          $vcvars = Join-Path $vsInstall "VC\Auxiliary\Build\vcvars64.bat"
          $launcherSource = (Resolve-Path "desktop/launcher.c").Path
          $launcherOut = Join-Path $appRoot "Pre-Programmed.exe"
          $launcherObj = Join-Path $env:RUNNER_TEMP "pre-programmed-launcher.obj"
          $compile = "call `"$vcvars`" && cl.exe /nologo /O2 /MT /DUNICODE /D_UNICODE `"$launcherSource`" /Fo`"$launcherObj`" /link /SUBSYSTEM:WINDOWS /OUT:`"$launcherOut`""
          & cmd.exe /d /c $compile
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $launcherOut)) {
            throw "Portable root launcher compilation failed."
          }

          if (-not (Test-Path (Join-Path $engineRoot "Pre-Programmed.exe"))) {
            throw "Contained Electron runtime did not contain its executable."
          }
          "stage_root=$stageRoot" >> $env:GITHUB_OUTPUT
          "app_root=$appRoot" >> $env:GITHUB_OUTPUT
          "engine_root=$engineRoot" >> $env:GITHUB_OUTPUT

      - name: Smoke-test contained folder through root launcher
        shell: pwsh
        env:
          APP_ROOT: ${{ steps.stage.outputs.app_root }}
          ENGINE_ROOT: ${{ steps.stage.outputs.engine_root }}
        run: |
          $launcher = Join-Path $env:APP_ROOT "Pre-Programmed.exe"
          $installation = Join-Path $env:APP_ROOT "installation.txt"
          $config = Get-Content $installation -Raw
          $config = $config -replace '(?m)^AUTHOR_KEY=.*$', 'AUTHOR_KEY=folder-self-test-key'
          $config = $config -replace '(?m)^START_BUTTON_TEXT=.*$', 'START_BUTTON_TEXT=FRIEND TEST'
          Set-Content -Path $installation -Value $config -Encoding UTF8 -NoNewline

          $stdout = Join-Path $env:APP_ROOT "self-test-stdout.txt"
          $stderr = Join-Path $env:APP_ROOT "self-test-stderr.txt"
          $process = Start-Process -FilePath $launcher -ArgumentList "--self-test" -WorkingDirectory $env:APP_ROOT -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($process.ExitCode -ne 0) {
            Get-ChildItem $env:APP_ROOT -Recurse -Force | ForEach-Object { Write-Host $_.FullName }
            throw "Contained portable runtime self-test failed with exit code $($process.ExitCode)."
          }

          if (-not (Test-Path (Join-Path $env:ENGINE_ROOT "data"))) {
            throw "Portable runtime did not keep generated state beneath _engine."
          }
          if (Test-Path (Join-Path $env:APP_ROOT "data")) {
            throw "Portable runtime recreated legacy root data."
          }
          if (Test-Path (Join-Path $env:APP_ROOT "exports")) {
            throw "Portable runtime recreated a root exports folder."
          }

          Copy-Item "desktop/installation-template.txt" $installation -Force
          Remove-Item $stdout, $stderr -Force -ErrorAction SilentlyContinue
          $containedData = Join-Path $env:ENGINE_ROOT "data"
          if (Test-Path $containedData) { Remove-Item $containedData -Recurse -Force }
          $wranglerState = Join-Path $env:APP_ROOT ".wrangler"
          if (Test-Path $wranglerState) { Remove-Item $wranglerState -Recurse -Force }

      - name: Verify friend-facing contained folder
        shell: pwsh
        env:
          APP_ROOT: ${{ steps.stage.outputs.app_root }}
          ENGINE_ROOT: ${{ steps.stage.outputs.engine_root }}
        run: |
          foreach ($required in @("Pre-Programmed.exe", "installation.txt", "assets", "_engine")) {
            if (-not (Test-Path (Join-Path $env:APP_ROOT $required))) {
              throw "Portable folder is missing required entry: $required"
            }
          }
          foreach ($requiredInternal in @("Pre-Programmed.exe", "README.txt", "resources")) {
            if (-not (Test-Path (Join-Path $env:ENGINE_ROOT $requiredInternal))) {
              throw "Portable _engine folder is missing required entry: $requiredInternal"
            }
          }

          $rootEntries = @(Get-ChildItem $env:APP_ROOT -Force | ForEach-Object Name | Sort-Object)
          $expectedRoot = @("_engine", "assets", "installation.txt", "Pre-Programmed.exe") | Sort-Object
          if (($rootEntries -join "`n") -ne ($expectedRoot -join "`n")) {
            Write-Host "Unexpected portable root entries:"
            $rootEntries | ForEach-Object { Write-Host $_ }
            throw "Portable root must expose only the launcher, installation.txt, assets, and _engine."
          }

          $installationLines = @(Get-Content (Join-Path $env:APP_ROOT "installation.txt"))
          if ($installationLines.Count -ne 2 -or $installationLines[0] -ne "AUTHOR_KEY=local" -or $installationLines[1] -ne "START_BUTTON_TEXT=INITIALIZE UNIVERSE") {
            throw "Portable installation.txt must contain exactly the two friend-facing settings."
          }

          if (@(Get-ChildItem (Join-Path $env:APP_ROOT "assets") -Force).Count -ne 0) {
            throw "Portable assets folder must be empty before distribution."
          }
          if (Test-Path (Join-Path $env:ENGINE_ROOT "data")) {
            throw "Portable internal data must be clean before distribution."
          }

          foreach ($forbidden in @("docs", "src", "tests", "worker", "scripts", ".github", "AGENTS.md", "FOUNDATION.md", "DOS-VISUAL-TARGET.md", "CODEX-HANDOFF.md")) {
            if (Test-Path (Join-Path $env:APP_ROOT $forbidden)) {
              throw "Developer/agent material leaked into portable folder: $forbidden"
            }
          }

      - name: Assemble contained-folder ZIP
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          STAGE_ROOT: ${{ steps.stage.outputs.stage_root }}
          APP_ROOT: ${{ steps.stage.outputs.app_root }}
        run: |
          $zip = Join-Path $PWD "Pre-Programmed-v$env:VERSION-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::Open($zip, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            [void]$archive.CreateEntry("Pre-Programmed/assets/")
            Get-ChildItem $env:APP_ROOT -Recurse -File | ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($env:STAGE_ROOT, $_.FullName).Replace('\', '/')
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
                $archive,
                $_.FullName,
                $relative,
                [System.IO.Compression.CompressionLevel]::Optimal
              ) | Out-Null
            }
          } finally {
            $archive.Dispose()
          }

          if (-not (Test-Path $zip)) { throw "Portable ZIP was not created." }
          $reader = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($reader.Entries | ForEach-Object FullName)
          } finally {
            $reader.Dispose()
          }
          foreach ($required in @(
            "Pre-Programmed/Pre-Programmed.exe",
            "Pre-Programmed/installation.txt",
            "Pre-Programmed/assets/",
            "Pre-Programmed/_engine/Pre-Programmed.exe",
            "Pre-Programmed/_engine/README.txt"
          )) {
            if ($entries -notcontains $required) { throw "Portable ZIP is missing required entry: $required" }
          }
          if ($entries -contains "Pre-Programmed/data/" -or $entries -contains "Pre-Programmed/exports/") {
            throw "Legacy root state folders leaked into portable ZIP."
          }
          if ($entries | Where-Object { $_ -match '(^|/)(AGENTS\.md|FOUNDATION\.md|DOS-VISUAL-TARGET\.md|CODEX-HANDOFF\.md)$' }) {
            throw "Agent-facing documentation leaked into portable ZIP."
          }
          if ($entries | Where-Object { $_ -match '\.zip$' }) {
            throw "Nested ZIP detected inside portable distribution."
          }

          "ZIP_PATH=$zip" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($existingTag) {
            throw "Release tag $tag already exists. Choose a new version so published builds stay immutable."
          }

          $arguments = @(
            "release", "create", $tag, $env:ZIP_PATH,
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", "Pre-Programmed $tag",
            "--generate-notes"
          )
          if ($env:VERSION -match '-') { $arguments += "--prerelease" }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed." }
