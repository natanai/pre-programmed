name: Update Author shell cleanup checkpoint

on:
  push:
    branches:
      - author-ux-integration-refactor

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: author-ux-integration-refactor
      - name: Update living plan
        run: python scripts/update-author-shell-cleanup-checkpoint.py
      - name: Commit checkpoint and remove one-shot tooling
        shell: bash
        run: |
          rm scripts/update-author-shell-cleanup-checkpoint.py
          rm .github/workflows/update-author-shell-cleanup-checkpoint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/author-ux-integration-refactor-plan.md scripts/update-author-shell-cleanup-checkpoint.py .github/workflows/update-author-shell-cleanup-checkpoint.yml
          git commit -m 'docs: record remaining legacy editor shell cleanup'
          git push origin HEAD:author-ux-integration-refactor
